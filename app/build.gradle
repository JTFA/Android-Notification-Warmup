plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.jtfa.notificationfixer'

    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.jtfa.notificationfixer"
        minSdk 33
        targetSdk 36
        versionCode 94
        versionName "0.7.73-M6"
    }

    buildTypes {
        release {
            // M1 阶段不做代码优化，避免 R8 干扰调试
            optimization {
                enable false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.recyclerview

    // M4 特权增强：api 里有 IShizukuService / IRemoteProcess（在 shell uid 下执行命令要用），
    // provider 里有 ShizukuProvider（Shizuku 应用靠它把 binder 送进来）。
    // 只有真正点了「申请授权」才会用到，非 root 路径完全不依赖它们。
    implementation libs.shizuku.api
    implementation libs.shizuku.provider
}
